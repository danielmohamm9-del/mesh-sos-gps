name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Project Files Automatically
        run: |
          # 1. Buat direktori struktur Android
          mkdir -p app/src/main/java/com/emergency/meshgps
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 2. File settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MeshSOSGPS"
          include(":app")
          EOF

          # 3. File build.gradle.kts (Root)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. File app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.emergency.meshgps"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.emergency.meshgps"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("com.google.android.gms:play-services-location:21.1.0")
              implementation("com.google.android.gms:play-services-nearby:19.1.0")
              implementation("org.osmdroid:osmdroid-android:6.1.18")
              implementation("com.google.code.gson:gson:2.10.1")
          }
          EOF

          # 5. File AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android.permission.ACCESS_FINE_LOCATION />
              <uses-permission android.permission.ACCESS_COARSE_LOCATION />
              <uses-permission android.permission.ACCESS_WIFI_STATE />
              <uses-permission android.permission.CHANGE_WIFI_STATE />
              <uses-permission android.permission.CHANGE_NETWORK_STATE />
              <uses-permission android.permission.INTERNET />
              <uses-permission android.permission.ACCESS_NETWORK_STATE />
              <uses-permission android.permission.BLUETOOTH />
              <uses-permission android.permission.BLUETOOTH_ADMIN />
              <uses-permission android.permission.BLUETOOTH_SCAN android:usesPermissionFlags="neverForLocation" tools:targetApi="s" />
              <uses-permission android.permission.BLUETOOTH_ADVERTISE tools:targetApi="s" />
              <uses-permission android.permission.BLUETOOTH_CONNECT tools:targetApi="s" />
              <uses-permission android.permission.NEARBY_WIFI_DEVICES android:usesPermissionFlags="neverForLocation" tools:targetApi="tiramisu" />

              <application
                  android:allowBackup="true"
                  android:label="Mesh SOS GPS"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. File activity_main.xml (Layout)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <org.osmdroid.views.MapView
                  android:id="@+id/mapView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_alignParentTop="true"
                  android:background="#CC000000"
                  android:orientation="vertical"
                  android:padding="12dp">

                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Status: GPS Mencari Sinyal Satelit..."
                      android:textColor="#FFFFFF"
                      android:textStyle="bold" />
              </LinearLayout>

              <Button
                  android:id="@+id/btnBroadcast"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:layout_alignParentBottom="true"
                  android:layout_margin="16dp"
                  android:backgroundTint="#D32F2F"
                  android:text="PANCARKAN LOKASI SAYA (OFFLINE SOS)"
                  android:textColor="#FFFFFF"
                  android:textSize="16sp"
                  android:textStyle="bold" />
          </RelativeLayout>
          EOF

          # 7. File UserLocation.kt
          cat << 'EOF' > app/src/main/java/com/emergency/meshgps/UserLocation.kt
          package com.emergency.meshgps

          data class UserLocation(
              val userId: String,
              val name: String,
              val latitude: Double,
              val longitude: Double,
              val status: String = "SOS",
              val timestamp: Long = System.currentTimeMillis()
          )
          EOF

          # 8. File MeshNetworkManager.kt
          cat << 'EOF' > app/src/main/java/com/emergency/meshgps/MeshNetworkManager.kt
          package com.emergency.meshgps

          import android.content.Context
          import com.google.android.gms.nearby.Nearby
          import com.google.android.gms.nearby.connection.*
          import com.google.gson.Gson
          import java.nio.charset.StandardCharsets

          class MeshNetworkManager(
              private val context: Context,
              private val onLocationReceived: (UserLocation) -> Unit
          ) {
              private val SERVICE_ID = "com.emergency.meshgps.SERVICE_ID"
              private val connectionsClient = Nearby.getConnectionsClient(context)
              private val connectedEndpoints = mutableSetOf<String>()
              private val gson = Gson()

              fun startMeshNetwork(userName: String) {
                  startAdvertising(userName)
                  startDiscovery()
              }

              private fun startAdvertising(userName: String) {
                  val options = AdvertisingOptions.Builder().setStrategy(Strategy.P2P_CLUSTER).build()
                  connectionsClient.startAdvertising(userName, SERVICE_ID, connectionLifecycleCallback, options)
              }

              private fun startDiscovery() {
                  val options = DiscoveryOptions.Builder().setStrategy(Strategy.P2P_CLUSTER).build()
                  connectionsClient.startDiscovery(SERVICE_ID, endpointDiscoveryCallback, options)
              }

              private val endpointDiscoveryCallback = object : EndpointDiscoveryCallback() {
                  override fun onEndpointFound(endpointId: String, info: DiscoveredEndpointInfo) {
                      connectionsClient.requestConnection("NODE", endpointId, connectionLifecycleCallback)
                  }
                  override fun onEndpointLost(endpointId: String) {
                      connectedEndpoints.remove(endpointId)
                  }
              }

              private val connectionLifecycleCallback = object : ConnectionLifecycleCallback() {
                  override fun onConnectionInitiated(endpointId: String, connectionInfo: ConnectionInfo) {
                      connectionsClient.acceptConnection(endpointId, payloadCallback)
                  }
                  override fun onConnectionResult(endpointId: String, result: ConnectionResolution) {
                      if (result.status.isSuccess) {
                          connectedEndpoints.add(endpointId)
                      }
                  }
                  override fun onDisconnected(endpointId: String) {
                      connectedEndpoints.remove(endpointId)
                  }
              }

              private val payloadCallback = object : PayloadCallback() {
                  override fun onPayloadReceived(endpointId: String, payload: Payload) {
                      if (payload.type == Payload.Type.BYTES) {
                          val bytes = payload.asBytes() ?: return
                          val jsonStr = String(bytes, StandardCharsets.UTF_8)
                          try {
                              val location = gson.fromJson(jsonStr, UserLocation::class.java)
                              onLocationReceived(location)
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }
                  }
                  override fun onPayloadTransferUpdate(endpointId: String, update: PayloadTransferUpdate) {}
              }

              fun broadcastLocation(location: UserLocation) {
                  if (connectedEndpoints.isEmpty()) return
                  val jsonStr = gson.toJson(location)
                  val payload = Payload.fromBytes(jsonStr.toByteArray(StandardCharsets.UTF_8))
                  connectionsClient.sendPayload(connectedEndpoints.toList(), payload)
              }

              fun stopMesh() {
                  connectionsClient.stopAdvertising()
                  connectionsClient.stopDiscovery()
                  connectionsClient.stopAllEndpoints()
              }
          }
          EOF

          # 9. File MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/emergency/meshgps/MainActivity.kt
          package com.emergency.meshgps

          import android.Manifest
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Looper
          import android.preference.PreferenceManager
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import com.google.android.gms.location.*
          import org.osmdroid.config.Configuration
          import org.osmdroid.tileprovider.tilesource.TileSourceFactory
          import org.osmdroid.util.GeoPoint
          import org.osmdroid.views.MapView
          import org.osmdroid.views.overlay.Marker
          import java.util.UUID

          class MainActivity : AppCompatActivity() {

              private lateinit var mapView: MapView
              private lateinit var tvStatus: TextView
              private lateinit var btnBroadcast: Button
              private lateinit var fusedLocationClient: FusedLocationProviderClient
              private lateinit var meshManager: MeshNetworkManager

              private val myUserId = UUID.randomUUID().toString().substring(0, 5)
              private var currentLocation: UserLocation? = null
              private val activeMarkers = mutableMapOf<String, Marker>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  Configuration.getInstance().load(this, PreferenceManager.getDefaultSharedPreferences(this))
                  setContentView(R.layout.activity_main)

                  mapView = findViewById(R.id.mapView)
                  tvStatus = findViewById(R.id.tvStatus)
                  btnBroadcast = findViewById(R.id.btnBroadcast)

                  setupMap()
                  checkAndRequestPermissions()

                  meshManager = MeshNetworkManager(this) { receivedLoc ->
                      runOnUiThread {
                          updateOrAddMapMarker(receivedLoc)
                      }
                  }

                  fusedLocationClient = LocationServices.getFusedLocationProviderClient(this)
                  startGPSUpdates()

                  btnBroadcast.setOnClickListener {
                      currentLocation?.let { loc ->
                          meshManager.broadcastLocation(loc)
                          Toast.makeText(this, "Lokasi dipancarkan!", Toast.LENGTH_SHORT).show()
                      } ?: Toast.makeText(this, "GPS Belum mengunci!", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun setupMap() {
                  mapView.setTileSource(TileSourceFactory.MAPNIK)
                  mapView.setBuiltInZoomControls(true)
                  mapView.setMultiTouchControls(true)
                  mapView.controller.setZoom(17.0)
              }

              private fun startGPSUpdates() {
                  val locationRequest = LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, 5000)
                      .setMinUpdateIntervalMillis(2000)
                      .build()

                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                      fusedLocationClient.requestLocationUpdates(locationRequest, object : LocationCallback() {
                          override fun onLocationResult(locationResult: LocationResult) {
                              val loc = locationResult.lastLocation ?: return
                              currentLocation = UserLocation(
                                  userId = myUserId,
                                  name = "User-$myUserId",
                                  latitude = loc.latitude,
                                  longitude = loc.longitude
                              )

                              val myPoint = GeoPoint(loc.latitude, loc.longitude)
                              mapView.controller.setCenter(myPoint)
                              updateOrAddMapMarker(currentLocation!!)
                              tvStatus.text = "GPS Terkunci: ${loc.latitude}, ${loc.longitude}"
                          }
                      }, Looper.getMainLooper())
                  }
              }

              private fun updateOrAddMapMarker(userLoc: UserLocation) {
                  val point = GeoPoint(userLoc.latitude, userLoc.longitude)

                  if (activeMarkers.containsKey(userLoc.userId)) {
                      activeMarkers[userLoc.userId]?.position = point
                  } else {
                      val marker = Marker(mapView)
                      marker.position = point
                      marker.title = "${userLoc.name} (${userLoc.status})"
                      marker.setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                      mapView.overlays.add(marker)
                      activeMarkers[userLoc.userId] = marker
                  }
                  mapView.invalidate()
              }

              private fun checkAndRequestPermissions() {
                  val permissions = mutableListOf(
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  )

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      permissions.add(Manifest.permission.BLUETOOTH_SCAN)
                      permissions.add(Manifest.permission.BLUETOOTH_ADVERTISE)
                      permissions.add(Manifest.permission.BLUETOOTH_CONNECT)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissions.add(Manifest.permission.NEARBY_WIFI_DEVICES)
                  }

                  ActivityCompat.requestPermissions(this, permissions.toTypedArray(), 101)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 101 && grantResults.all { it == PackageManager.PERMISSION_GRANTED }) {
                      meshManager.startMeshNetwork("User-$myUserId")
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  meshManager.stopMesh()
              }
          }
          EOF

      - name: Setup Gradle without Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshSOS-GPS-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
